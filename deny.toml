[graph]
all-features = true
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
# Wasmtime 48 reaches this graph only through the SDK's non-default `host` feature, which the
# dev-dependency broker host turns on; `security/wasm-dependencies.txt` records that neither it
# nor encoding_rs is compiled into the shipped component. Named per crate so a BSD-3-Clause crate
# that does reach the shipped closure still fails.
exceptions = [
  { name = "encoding_rs", version = "=0.8.35", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
deny = []
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
