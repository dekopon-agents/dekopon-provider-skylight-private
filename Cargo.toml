[workspace]

[package]
name = "dekopon-skylight-private-provider"
version = "0.5.0"
edition = "2024"
rust-version = "1.98.1"
description = "Unsupported private Skylight account and frame reads over broker HTTP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/dekopon-agents/dekopon-provider-skylight-private"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
dekopon-provider-sdk = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
schemars = "=1.2.2"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[dev-dependencies]
dekopon-provider-sdk-testkit = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
dekopon-broker-host = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
dekopon-capability = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
dekopon-core = { git = "https://github.com/dekopon-agents/dekopon", rev = "16c17e8554d7142ba3ebb944930bbfae64bc2db6" }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

# The generated wit-bindgen export shims expand at crate scope. Denying unsafe code here would
# require a crate-wide exception and would not protect provider-authored code.
[lints.rustdoc]
broken_intra_doc_links = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
